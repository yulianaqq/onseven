<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дякуємо за замовлення</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <!-- Meta Pixel Code -->

  <style>
    .ty-hero{ padding:64px 24px 76px; min-height:60vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .ty-check{
      width:78px; height:78px; margin:0 auto 22px;
      display:grid; place-items:center;
      border-radius:50%;
      background:rgba(255,255,255,.2);
      border:2px solid rgba(255,255,255,.5);
      color:#fff; font-size:40px; font-weight:900;
    }
    .ty-sub{
      max-width:420px; margin:0 auto 28px;
      color:rgba(255,255,255,.92);
      font-size:14px; font-weight:700; line-height:1.55;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <div class="logo" id="hlogo">Магазин</div>
      <a class="hphone" id="hphone" href="tel:+380000000000">+380 00 000 00 00</a>
    </header>

    <main>
      <section class="hero ty-hero">
        <div class="ty-check">✓</div>
        <h1>Дякуємо за замовлення</h1>
        <p class="ty-sub">Ми отримали вашу заявку. Менеджер зв'яжеться з вами найближчим часом для підтвердження.</p>
        <a href="index.html" class="btn-hero">← На головну</a>
      </section>
    </main>

    <footer>
      <p id="footer-text">© 2026 Магазин · Усі права захищені</p>
    </footer>
  </div>

  <script>
    // Підтягуємо назву магазину/телефон з налаштувань адмінки (якщо вони вже збережені в цьому браузері)
    try {
      var raw = localStorage.getItem('ls_store');
      if (raw) {
        var data = JSON.parse(raw);
        if (data && data.name) document.getElementById('hlogo').textContent = data.name;
        if (data && data.phone) {
          var phoneEl = document.getElementById('hphone');
          phoneEl.textContent = data.phone;
          phoneEl.href = 'tel:' + data.phone.replace(/\s/g, '');
        }
        if (data && data.footer) document.getElementById('footer-text').textContent = data.footer;
      }
    } catch (e) {}
  </script>
</body>
</html>
